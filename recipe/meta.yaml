{% set version = "1.9.2" %}

package:
  name: arlpy
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/a/arlpy/arlpy-{{ version }}.tar.gz
  sha256: f4deff0835d4423f39f97241170a1ccb4fe03d509dce3819a6b1c56f388e1953

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - bokeh >=1.4.0
    - numpy >=1.18.1,<2
    - pandas >=1.0.1
    - scipy >=1.4.1
    - utm >=0.5.0

test:
  imports:
    - arlpy
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip


about:
  home: https://github.com/org-arl/arlpy
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: ARL Python Tools

extra:
  recipe-maintainers:
    - ocefpaf
